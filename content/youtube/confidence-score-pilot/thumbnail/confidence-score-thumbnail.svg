<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.58" stop-color="#090c11"/>
      <stop offset="1" stop-color="#24100b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ff6038" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6038" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.36"/>
    </linearGradient>
    <pattern id="lines" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="90" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="711" y="118" width="520" height="480" rx="18"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="orangeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ff6038" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect width="1280" height="720" fill="url(#lines)"/>
  <rect x="0" y="0" width="13" height="720" fill="#ff6038"/>

  <!-- Brand -->
  <g transform="translate(61 66)">
    <g fill="#ff6038">
      <rect x="-5" y="-33" width="10" height="31" rx="5"/>
      <rect x="-5" y="-33" width="10" height="31" rx="5" transform="rotate(120)"/>
      <rect x="-5" y="-33" width="10" height="31" rx="5" transform="rotate(240)"/>
      <circle r="8"/>
    </g>
    <text x="39" y="-4" fill="#f4f7fb" font-family="Avenir Next, Arial, sans-serif" font-size="25" font-weight="800">PROPELLER</text>
    <text x="41" y="20" fill="#ff6038" font-family="Avenir Next, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="7">PICKS</text>
  </g>

  <!-- High-contrast thumbnail headline -->
  <text x="60" y="168" fill="#ff6038" font-family="Avenir Next, Arial, sans-serif" font-size="34" font-weight="750" letter-spacing="4">WHAT DOES</text>
  <text x="50" y="358" fill="#ff6038" font-family="Avenir Next, Arial, sans-serif" font-size="205" font-weight="900" letter-spacing="-10" filter="url(#orangeGlow)">72</text>
  <text x="322" y="282" fill="#f4f7fb" font-family="Avenir Next, Arial, sans-serif" font-size="55" font-weight="900" letter-spacing="-2">CONFIDENCE</text>
  <text x="324" y="348" fill="#f4f7fb" font-family="Avenir Next, Arial, sans-serif" font-size="55" font-weight="900" letter-spacing="-2">MEAN?</text>

  <rect x="61" y="410" width="544" height="66" rx="33" fill="#ff6038"/>
  <text x="333" y="452" text-anchor="middle" fill="#111316" font-family="Avenir Next, Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="1.1">NOT A WIN PROBABILITY</text>

  <text x="62" y="535" fill="#aeb9c5" font-family="Avenir Next, Arial, sans-serif" font-size="25" font-weight="650">How to read the score, line,</text>
  <text x="62" y="570" fill="#aeb9c5" font-family="Avenir Next, Arial, sans-serif" font-size="25" font-weight="650">evidence and agent breakdown.</text>

  <g transform="translate(62 622)">
    <circle cx="9" cy="9" r="9" fill="#10b981"/>
    <text x="30" y="17" fill="#f4f7fb" font-family="Avenir Next, Arial, sans-serif" font-size="20" font-weight="750" letter-spacing="1.2">DESKTOP + MOBILE WALKTHROUGH</text>
  </g>

  <!-- Real Propeller interface, enlarged for thumbnail legibility -->
  <g filter="url(#shadow)">
    <rect x="688" y="84" width="566" height="552" rx="28" fill="#111720" stroke="#667180" stroke-width="3"/>
    <circle cx="720" cy="107" r="7" fill="#ff675f"/>
    <circle cx="743" cy="107" r="7" fill="#f7c84b"/>
    <circle cx="766" cy="107" r="7" fill="#42ca78"/>
    <rect x="800" y="97" width="420" height="20" rx="10" fill="#24303e"/>
    <text x="822" y="112" fill="#9aa8b7" font-family="SFMono-Regular, Menlo, monospace" font-size="11">app.propellerpicks.com</text>
    <g clip-path="url(#screenClip)">
      <image xlink:href="app-real-prop-detail-clean.png" x="560" y="-15" width="1480" height="832" preserveAspectRatio="none"/>
      <rect x="711" y="118" width="520" height="480" fill="url(#panelShade)" opacity="0.12"/>
    </g>
  </g>

  <!-- Confidence focal badge -->
  <g transform="translate(1018 310)" filter="url(#shadow)">
    <circle r="112" fill="#0a0e13" stroke="#ff6038" stroke-width="12"/>
    <circle r="94" fill="#111720" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <text y="15" text-anchor="middle" fill="#ff6038" font-family="Avenir Next, Arial, sans-serif" font-size="88" font-weight="900">72</text>
    <text y="55" text-anchor="middle" fill="#f4f7fb" font-family="Avenir Next, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="4">CONFIDENCE</text>
  </g>

  <path d="M650 316c38 0 54 1 87-2" fill="none" stroke="#ff6038" stroke-width="8" stroke-linecap="round"/>
  <path d="M729 295l28 18-27 20" fill="none" stroke="#ff6038" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="706" y="574" width="526" height="43" rx="21" fill="#0b0f14" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="969" y="602" text-anchor="middle" fill="#d5dde6" font-family="Avenir Next, Arial, sans-serif" font-size="16" font-weight="750" letter-spacing="2">REAL PROPELLER PICKS INTERFACE</text>
</svg>
