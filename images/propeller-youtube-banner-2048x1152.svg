<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset="0.56" stop-color="#0b0e12"/>
      <stop offset="1" stop-color="#130b09"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="0" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#ff6038" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff6038" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="1" cy="0.5" r="0.72">
