    <pattern id="grid" width="112" height="112" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="112" stroke="#ffffff" stroke-opacity="0.032" stroke-width="2"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
