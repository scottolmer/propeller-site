      <text x="1724" y="414" fill="#e4e9ef">Market Check</text><text x="1984" y="414" text-anchor="end" fill="#10b981">SUPPORTS LESS</text>
      <text x="1724" y="458" fill="#e4e9ef">Hit Rate</text><text x="1984" y="458" text-anchor="end" fill="#10b981">SUPPORTS LESS</text>
